# 커밋된 자격증명을 푸시·PR 단계에서 잡는다.
#
# 조직이 4개(MV-SolutionWeb / MV-Platform / MV-Server / MV-AXLab)로 나뉘어 있어
# 비공개 저장소 간 재사용 워크플로 호출이 되지 않는다. 그래서 각 저장소가
# 자기 완결적으로 들고 있는다. 규칙을 바꿀 때는 배포 스크립트로 일괄 갱신한다.
#
# 문서: MV-AXLab/mv-brain-infra

name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR에서는 변경분만 보면 충분하지만, 푸시에서는 히스토리까지 본다.
          fetch-depth: 0

      - name: gitleaks 설치
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 스캔 (보고 전용)
        run: |
          # --redact: 로그에 실제 값이 남지 않게 한다. 워크플로 로그도 유출 경로다.
          #
          # --exit-code 0 인 이유: 도입 시점에 이미 자격증명이 들어 있는 저장소가
          # 다수라, 차단 모드로 켜면 개발자가 자기 잘못이 아닌 실패를 매 푸시마다
          # 보게 된다. 그러면 CI 자체를 무시하게 되고, 진짜 유출도 묻힌다.
          # 기존 건을 정리하거나 baseline 을 심은 뒤 1 로 올린다.
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 0 \
            || true

      - name: 요약
        if: always()
        run: |
          n=$(python3 -c "import json,sys;d=json.load(open('gitleaks.sarif'));print(sum(len(r['results']) for r in d['runs']))" 2>/dev/null || echo 0)
          echo "발견 $n 건 (보고 전용 — 빌드를 실패시키지 않습니다)" >> $GITHUB_STEP_SUMMARY
          [ "$n" != "0" ] && echo "상세는 아티팩트 gitleaks-report 를 받으세요." >> $GITHUB_STEP_SUMMARY || true

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14
